<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模板下载</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">模</span>
        <span class="brand-name">模板下载</span>
      </div>
      <input type="search" id="search-input" class="search-input" placeholder="搜索：名称 / 标签 / 分类…" autocomplete="off" />
      <div class="topbar-actions">
        <select id="sort-select" class="sort-select" title="排序">
          <option value="updated">默认排序</option>
          <option value="name">名称排序</option>
          <option value="size">文件大小</option>
        </select>
        <a class="add-btn" href="add.html">＋ 添加模板</a>
      </div>
    </div>
  </header>

  <!-- 筛选面板 -->
  <section class="filter-panel" id="filter-panel">
    <div class="filter-inner">
      <div class="filter-row" id="row-type">
        <span class="filter-label">类型</span>
        <div class="filter-tags">
          <span class="filter-tag active" data-key="type" data-val="__all__">全部类型</span>
          <span class="filter-tag" data-key="type" data-val="AE模板">AE模板</span>
          <span class="filter-tag" data-key="type" data-val="Pr模板">Pr模板</span>
          <span class="filter-tag" data-key="type" data-val="视频素材">视频素材</span>
          <span class="filter-tag" data-key="type" data-val="C4D模型">C4D模型</span>
          <span class="filter-tag" data-key="type" data-val="FCP模板">FCP模板</span>
          <span class="filter-tag" data-key="type" data-val="3dMax模型">3dMax模型</span>
        </div>
      </div>
      <div class="filter-row" id="row-style">
        <span class="filter-label">风格</span>
        <div class="filter-tags">
          <span class="filter-tag active" data-key="style" data-val="__all__">全部风格</span>
          <span class="filter-tag" data-key="style" data-val="实拍写实">实拍写实</span>
          <span class="filter-tag" data-key="style" data-val="立体三维">立体三维</span>
          <span class="filter-tag" data-key="style" data-val="平面二维">平面二维</span>
          <span class="filter-tag" data-key="style" data-val="抽象光影">抽象光影</span>
          <span class="filter-tag" data-key="style" data-val="故障风">故障风</span>
          <span class="filter-tag" data-key="style" data-val="霓虹赛博">霓虹赛博</span>
          <span class="filter-tag" data-key="style" data-val="粒子光效">粒子光效</span>
          <span class="filter-tag" data-key="style" data-val="简约卡通风">简约卡通风</span>
        </div>
      </div>
      <div class="filter-row" id="row-source">
        <span class="filter-label">创作</span>
        <div class="filter-tags">
          <span class="filter-tag active" data-key="source" data-val="__all__">全部创作</span>
          <span class="filter-tag" data-key="source" data-val="真实影像">真实影像</span>
          <span class="filter-tag" data-key="source" data-val="含AI">含AI</span>
          <span class="filter-tag" data-key="source" data-val="不含AI">不含AI</span>
        </div>
      </div>
      <div class="filter-row" id="row-advanced">
        <span class="filter-label">高级</span>
        <div class="filter-tags">
          <select class="adv-select" id="adv-resolution"><option value="__all__">分辨率</option><option value="4K">4K</option><option value="1080P">1080P</option><option value="720P">720P</option></select>
          <select class="adv-select" id="adv-ratio"><option value="__all__">宽高比</option><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option><option value="4:3">4:3</option></select>
          <select class="adv-select" id="adv-fps"><option value="__all__">帧率</option><option value="24">24fps</option><option value="25">25fps</option><option value="30">30fps</option><option value="60">60fps</option></select>
          <select class="adv-select" id="adv-duration"><option value="__all__">时长</option><option value="short">10秒内</option><option value="mid">10-30秒</option><option value="long">30秒以上</option></select>
        </div>
        <div class="filter-tools">
          <button class="tool-btn" id="btn-collapse" title="收起/展开筛选">收起筛选</button>
          <button class="tool-btn" id="btn-reset" title="重置所有条件">条件重置</button>
        </div>
      </div>
    </div>
  </section>

  <main class="site-main">
    <div class="stats-line" id="stats-line"></div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">∅</div>
      <p>没有匹配的模板，换个条件试试</p>
      <a class="add-btn" href="add.html">＋ 去添加模板</a>
    </div>
  </main>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="modal-mask" hidden>
    <div class="modal">
      <button class="modal-close" id="modal-close" title="关闭">×</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>模板下载 · 数据保存在 <code>js/data.js</code> · 添加模板请用 <a href="add.html">添加模板工具页</a></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
