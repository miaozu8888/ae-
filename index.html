<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AE 模板库 · VJ Vault</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">VJ</span>
        <span class="brand-name">AE 模板库</span>
      </div>
      <div class="header-actions">
        <input type="search" id="search-input" class="search-input" placeholder="模糊搜索：名称 / 标签 / 分类…" autocomplete="off" />
        <div class="sort-select-wrap">
          <select id="sort-select" class="sort-select">
            <option value="updated">最近更新</option>
            <option value="name">名称排序</option>
            <option value="size">文件大小</option>
          </select>
        </div>
      </div>
    </div>
    <div class="category-bar" id="category-bar">
      <span class="category-chip active" data-cat="__all__">全部</span>
    </div>
  </header>

  <main class="site-main">
    <div class="stats-line" id="stats-line"></div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">∅</div>
      <p>没有匹配的模板，换个关键词试试</p>
    </div>
  </main>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="modal-mask" hidden>
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" title="关闭">×</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>AE 模板库 · 本地私有模板站 · 数据保存在 <code>js/data.js</code></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
