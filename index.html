﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模板下载</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">模</span>
        <span class="brand-name">模板下载</span>
      </div>
      <input type="search" id="search-input" class="search-input" placeholder="搜索：名称 / 标签 / 分类…" autocomplete="off" />
      <div class="topbar-actions">
        <select id="sort-select" class="sort-select" title="排序">
          <option value="updated">默认排序</option>
          <option value="name">名称排序</option>
          <option value="size">文件大小</option>
        </select>
        <a class="add-btn" href="add.html">＋ 添加模板</a>
      </div>
    </div>
  </header>

  <!-- 筛选面板（标签由 js/data.js 的 FILTER_OPTIONS 动态生成） -->
  <section class="filter-panel" id="filter-panel">
    <div class="filter-inner" id="filter-inner"></div>
  </section>

  <main class="site-main">
    <div class="stats-line" id="stats-line"></div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">∅</div>
      <p>没有匹配的模板，换个条件试试</p>
      <a class="add-btn" href="add.html">＋ 去添加模板</a>
    </div>
  </main>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="modal-mask" hidden>
    <div class="modal">
      <button class="modal-close" id="modal-close" title="关闭">×</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>模板下载 · 数据保存在 <code>js/data.js</code> · 添加模板请用 <a href="add.html">添加模板工具页</a></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
